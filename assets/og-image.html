<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Proxy Voting Panel &mdash; preview card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600;700&family=Fira+Sans:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 84px; background: #0d0d0d; color: #fff; font-family: "Fira Sans", sans-serif; position: relative; overflow: hidden; }

  h1 { position: relative; z-index: 1; font-family: "EB Garamond", Garamond, serif; font-weight: 700; font-size: 80px; line-height: 1.06; margin: 28px 0 0; max-width: 980px; }
  .sub { position: relative; z-index: 1; margin-top: 30px; font-size: 30px; color: #c3c2b7; max-width: 820px; line-height: 1.35; }
  .box { position: absolute; z-index: 1; right: 96px; bottom: 84px; width: 150px; height: 150px; }
</style>

  <div class="kicker">Proxy Voting Panel</div>
